/* ===== AJUSTES PARA CELULAR ===== */
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  padding: max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
           max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.opcao, button, .modo-som label {

  -webkit-tap-highlight-color: transparent;

/* evita o "hover preso" depois de tocar numa opção */
@media (hover: none) {

  #legendaNotas { font-size: 0.9rem; }

// ============================================================
// CONVERSOR DE NOTA
// ============================================================
function converterNota(nome) {
  const mapaLetras = { do: 'c', re: 'd', mi: 'e', fa: 'f', sol: 'g', la: 'a', si: 'b' };
  const mapaBonito = { do: 'Dó', re: 'Ré', mi: 'Mi', fa: 'Fá', sol: 'Sol', la: 'Lá', si: 'Si' };
  const mapaAcidenteBonito = { '#': '♯', 'b': '♭', '##': '𝄪', 'bb': '𝄫' };

  const match = nome.toLowerCase().match(/^(do|re|mi|fa|sol|la|si)(##|bb|#|b)?(-?\d+)$/);
  if (!match) throw new Error(`Nota inválida: "${nome}".`);
  const [, letraPT, acidente, oitavaStr] = match;
  const oitava = parseInt(oitavaStr, 10);
  const letra = mapaLetras[letraPT];

  const vexKey = letra + (acidente || '') + '/' + oitava;
  const bonito = mapaBonito[letraPT] + (acidente ? mapaAcidenteBonito[acidente] : '') + oitava;

  return { vexKey, letra, letraPT, oitava, acidente: acidente || null, bonito };
}

// Fisher–Yates: retorna uma cópia embaralhada do array
function embaralhar(array) {
  const copia = array.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

// Embaralha as opções de uma pergunta e recalcula o índice correto
function embaralharOpcoes(pergunta) {
  const indices = pergunta.opcoes.map((_, i) => i);
  const indicesEmbaralhados = embaralhar(indices);
  const novasOpcoes = indicesEmbaralhados.map(i => pergunta.opcoes[i]);
  const novaCorreta = indicesEmbaralhados.indexOf(pergunta.correta);
  return {
    nota1: pergunta.nota1,
    nota2: pergunta.nota2,
    opcoes: novasOpcoes,
    correta: novaCorreta
  };
}

// Gera a lista final: perguntas embaralhadas, cada uma com opções embaralhadas
function gerarPerguntasEmbaralhadas() {
  return embaralhar(perguntasOriginais).map(embaralharOpcoes);
}

let audioCtx = null;
let audioAtivo = false;
let fontesAtivas = [];
let timeoutIds = [];

const SEMITONS_LETRA = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
const FREQ_DO4 = 261.6255653;

function notaParaFrequencia(nome) {
  const n = converterNota(nome);
  const valorAc = n.acidente ? ({ '#': 1, '##': 2, 'b': -1, 'bb': -2 }[n.acidente] || 0) : 0;
  const semitonsDesdeDo4 = (n.oitava - 4) * 12 + SEMITONS_LETRA[n.letra] + valorAc;
  return FREQ_DO4 * Math.pow(2, semitonsDesdeDo4 / 12);
}

function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tocarNota(freq, quando, duracao) {
  const ctx = getAudioContext();
  const agora = ctx.currentTime + quando;

  const ganhoMestre = ctx.createGain();
  ganhoMestre.connect(ctx.destination);
  const pico = 0.22;
  ganhoMestre.gain.setValueAtTime(0, agora);
  ganhoMestre.gain.linearRampToValueAtTime(pico, agora + 0.008);
  ganhoMestre.gain.exponentialRampToValueAtTime(0.0001, agora + duracao);

  const harmonicos = [
    { mult: 1, ganho: 1.0 }, { mult: 2, ganho: 0.5 }, { mult: 3, ganho: 0.25 },
    { mult: 4, ganho: 0.12 }, { mult: 5, ganho: 0.06 }, { mult: 6, ganho: 0.03 },
  ];
  harmonicos.forEach(h => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * h.mult, agora);
    const g = ctx.createGain();
    g.gain.setValueAtTime(h.ganho, agora);
    osc.connect(g); g.connect(ganhoMestre);
    osc.start(agora); osc.stop(agora + duracao + 0.05);
    fontesAtivas.push(osc);
  });

  const ruido = ctx.createBufferSource();
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.02, ctx.sampleRate);
  const dados = buffer.getChannelData(0);
  for (let i = 0; i < dados.length; i++) {
    dados[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.003));
  }
  ruido.buffer = buffer;
  const gRuido = ctx.createGain();
  gRuido.gain.setValueAtTime(0.06, agora);
  ruido.connect(gRuido); gRuido.connect(ganhoMestre);
  ruido.start(agora);
}

function pararSom() {
  timeoutIds.forEach(id => clearTimeout(id));
  timeoutIds = [];
  fontesAtivas.forEach(f => { try { f.stop(); } catch (e) {} });
  fontesAtivas = [];
  audioAtivo = false;
}

function tocarIntervalo(nome1, nome2) {
  if (audioAtivo) { pararSom(); btnOuvir.textContent = '▶ Ouvir'; return; }
  audioAtivo = true;

  const modoEl = document.querySelector('input[name="modoSom"]:checked');
  const modo = modoEl ? modoEl.value : 'melodico';

  const freq1 = notaParaFrequencia(nome1);
  const freq2 = notaParaFrequencia(nome2);
  const durNota = 1.2;

  if (modo === 'melodico') {
    tocarNota(freq1, 0, durNota);
    tocarNota(freq2, durNota, durNota);
    const id = setTimeout(() => { audioAtivo = false; btnOuvir.textContent = '▶ Ouvir'; }, (durNota * 2 + 0.3) * 1000);
    timeoutIds.push(id);
  } else if (modo === 'harmonico') {
    tocarNota(freq1, 0, durNota + 0.4);
    tocarNota(freq2, 0, durNota + 0.4);
    const id = setTimeout(() => { audioAtivo = false; btnOuvir.textContent = '▶ Ouvir'; }, (durNota + 0.7) * 1000);
    timeoutIds.push(id);
  } else {
    const tempoTotal = durNota * 2 + 0.3;
    tocarNota(freq1, 0, durNota);
    tocarNota(freq2, durNota, durNota);
    const inicioHarm = tempoTotal + 0.2;
    tocarNota(freq1, inicioHarm, durNota);
    tocarNota(freq2, inicioHarm, durNota);
    const id = setTimeout(() => { audioAtivo = false; btnOuvir.textContent = '▶ Ouvir'; }, (inicioHarm + durNota + 0.4) * 1000);
    timeoutIds.push(id);
  }

  btnOuvir.textContent = '⏹ Parar';
}

const ORDEM_LETRAS = ['c', 'd', 'e', 'f', 'g', 'a', 'b'];
const NOME_LETRA = { c: 'Dó', d: 'Ré', e: 'Mi', f: 'Fá', g: 'Sol', a: 'Lá', b: 'Si' };

function valorAcidente(ac) {
  if (!ac) return 0;
  return { '#': 1, '##': 2, 'b': -1, 'bb': -2 }[ac] || 0;
}
function simboloAcidente(ac) {
  if (!ac) return '';
  return { '#': '♯', '##': '𝄪', 'b': '♭', 'bb': '𝄫' }[ac] || '';
}
function nomeNumero(n) {
  const nomes = {
    1: 'uníssono', 2: 'segunda', 3: 'terça', 4: 'quarta',
    5: 'quinta', 6: 'sexta', 7: 'sétima', 8: 'oitava',
    9: 'nona', 10: 'décima', 11: 'décima primeira',
    12: 'décima segunda', 13: 'décima terceira'
  };
  return nomes[n] || `${n}ª`;
}
function numeroIntervaloNatural(n1, n2) {
  const i1 = ORDEM_LETRAS.indexOf(n1.letra);
  const i2 = ORDEM_LETRAS.indexOf(n2.letra);
  const g1 = n1.oitava * 7 + i1;
  const g2 = n2.oitava * 7 + i2;
  return Math.abs(g2 - g1) + 1;
}
function semitonsNaturais(n1, n2) {
  const s1 = n1.oitava * 12 + SEMITONS_LETRA[n1.letra];
  const s2 = n2.oitava * 12 + SEMITONS_LETRA[n2.letra];
  return s2 - s1;
}
function qualidadeNatural(numero) {
  const mapa = {
    1: { nome: 'justo', semitons: 0 },
    2: { nome: 'maior', semitons: 2 },
    3: { nome: 'maior', semitons: 4 },
    4: { nome: 'justo', semitons: 5 },
    5: { nome: 'justo', semitons: 7 },
    6: { nome: 'maior', semitons: 9 },
    7: { nome: 'maior', semitons: 11 },
    8: { nome: 'justo', semitons: 12 },
  };
  if (mapa[numero]) return mapa[numero];
  const reduzido = ((numero - 1) % 7) + 1;
  const base = mapa[reduzido];
  return { nome: base.nome, semitons: base.semitons + 12 * Math.floor((numero - 1) / 7) };
}
function formatarSemitons(sem) {
  const tom = Math.floor(sem / 2);
  const resto = sem % 2;
  if (sem === 0) return '0 semitons';
  if (sem === 1) return '1 semitom';
  let partes = [];
  if (tom > 0) partes.push(`${tom} tom${tom > 1 ? 's' : ''}`);
  if (resto > 0) partes.push(`${resto} semitom`);
  return partes.join(' e ');
}
function qualidadeComDeslocamento(qualidadeBase, deslocamento) {
  if (qualidadeBase === 'justo') {
    if (deslocamento === 0) return 'justo';
    if (deslocamento > 0) {
      if (deslocamento === 1) return 'aumentado';
      if (deslocamento === 2) return 'dobradamente aumentado';
      return `${deslocamento}× aumentado`;
    }
    const a = -deslocamento;
    if (a === 1) return 'diminuto';
    if (a === 2) return 'dobradamente diminuto';
    return `${a}× diminuto`;
  } else if (qualidadeBase === 'maior') {
    if (deslocamento === 0) return 'maior';
    if (deslocamento === -1) return 'menor';
    if (deslocamento === -2) return 'diminuto';
    if (deslocamento === -3) return 'dobradamente diminuto';
    if (deslocamento > 0) {
      if (deslocamento === 1) return 'aumentado';
      if (deslocamento === 2) return 'dobradamente aumentado';
      return `${deslocamento}× aumentado`;
    }
    const a = -deslocamento;
    if (a === 2) return 'diminuto';
    if (a === 3) return 'dobradamente diminuto';
    return `${a - 1}× diminuto`;
  } else if (qualidadeBase === 'menor') {
    if (deslocamento === 0) return 'menor';
    if (deslocamento === 1) return 'maior';
    if (deslocamento === 2) return 'aumentado';
    if (deslocamento === 3) return 'dobradamente aumentado';
    if (deslocamento > 0) return `${deslocamento - 1}× aumentado`;
    const a = -deslocamento;
    if (a === 1) return 'diminuto';
    if (a === 2) return 'dobradamente diminuto';
    return `${a}× diminuto`;
  }
  return qualidadeBase;
}
function qualidadeAPartirDeSemitons(numero, semitons) {
  const qualBase = qualidadeNatural(numero);
  const diff = semitons - qualBase.semitons;
  if (diff === 0) return qualBase.nome;
  return qualidadeComDeslocamento(qualBase.nome, diff);
}
function gerarAnalise(nome1, nome2) {
  const n1 = converterNota(nome1);
  const n2 = converterNota(nome2);
  const num = numeroIntervaloNatural(n1, n2);
  const numNome = nomeNumero(num);
  const natural1 = { letra: n1.letra, oitava: n1.oitava };
  const natural2 = { letra: n2.letra, oitava: n2.oitava };
  const semNat = semitonsNaturais(natural1, natural2);
  const bonitoNat1 = NOME_LETRA[n1.letra] + n1.oitava;
  const bonitoNat2 = NOME_LETRA[n2.letra] + n2.oitava;
  const passos = [];

  let qualidadeNaturalDasLetras;
  if (num === 1) qualidadeNaturalDasLetras = 'justo';
  else qualidadeNaturalDasLetras = qualidadeAPartirDeSemitons(num, semNat);

  passos.push({
    rotulo: 'Classificação numérica',
    texto: `De <span class="nota">${bonitoNat1}</span> a <span class="nota">${bonitoNat2}</span>: ` +
           `<span class="destaque">${numNome} ${qualidadeNaturalDasLetras}</span>, com ${formatarSemitons(semNat)}.`
  });

  let qualidadeAtual = qualidadeNaturalDasLetras;
  let deslocamentoAcumuladoAtual = 0;

  if (n1.acidente) {
    const val = valorAcidente(n1.acidente);
    const efeito = -val;
    const novoDesloc = deslocamentoAcumuladoAtual + efeito;
    const novaQual = qualidadeComDeslocamento(qualidadeNaturalDasLetras, novoDesloc);
    const nomeAc = simboloAcidente(n1.acidente);
    const direcao = efeito > 0 ? 'aumenta' : 'diminui';
    passos.push({
      rotulo: `Acidente na nota inferior (${NOME_LETRA[n1.letra]}${nomeAc}${n1.oitava})`,
      texto: `O ${nomeAc} na nota inferior <span class="acidente">${direcao} ${Math.abs(efeito)} semitom</span> no intervalo, ` +
             `que passa a ser <span class="destaque">${numNome} ${novaQual}</span>.`
    });
    qualidadeAtual = novaQual;
    deslocamentoAcumuladoAtual = novoDesloc;
  }

  if (n2.acidente) {
    const val = valorAcidente(n2.acidente);
    const efeito = val;
    const novoDesloc = deslocamentoAcumuladoAtual + efeito;
    const novaQual = qualidadeComDeslocamento(qualidadeNaturalDasLetras, novoDesloc);
    const nomeAc = simboloAcidente(n2.acidente);
    const direcao = efeito > 0 ? 'aumenta' : 'diminui';
    passos.push({
      rotulo: `Acidente na nota superior (${NOME_LETRA[n2.letra]}${nomeAc}${n2.oitava})`,
      texto: `O ${nomeAc} na nota superior <span class="acidente">${direcao} ${Math.abs(efeito)} semitom</span> no intervalo, ` +
             `que passa a ser <span class="destaque">${numNome} ${novaQual}</span>.`
    });
    qualidadeAtual = novaQual;
    deslocamentoAcumuladoAtual = novoDesloc;
  }

  if (!n1.acidente && !n2.acidente) {
    passos.push({
      rotulo: 'Acidentes',
      texto: `Nenhuma das notas tem acidente, então o intervalo permanece <span class="destaque">${numNome} ${qualidadeNaturalDasLetras}</span>.`
    });
  }

  const resultadoFinal = `${numNome} ${qualidadeAtual}`;

  let html = `<span class="titulo">💡 Vamos analisar juntos</span>`;
  passos.forEach((p) => {
    html += `<div class="passo"><span class="rotulo">${p.rotulo}</span><span>${p.texto}</span></div>`;
  });
  html += `<div class="resultado">✔ Resultado: ${resultadoFinal}</div>`;
  return html;
}

// ============================================================
// PARTITURA
// ============================================================
function desenharPartitura(nome1, nome2) {
  elPartitura.querySelectorAll('svg').forEach(svg => svg.remove());
  const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
  const n1info = converterNota(nome1);
  const n2info = converterNota(nome2);
  const oitavaMin = Math.min(n1info.oitava, n2info.oitava);
  const yStave = oitavaMin >= 5 ? 10 : 30;

  const renderer = new Renderer(elPartitura, Renderer.Backends.SVG);
  renderer.resize(340, 200);
  const context = renderer.getContext();

  const stave = new Stave(10, yStave, 320);
  stave.addClef('treble');
  stave.setContext(context).draw();

  const n1 = new StaveNote({ keys: [n1info.vexKey], duration: 'q', clef: 'treble' });
  const n2 = new StaveNote({ keys: [n2info.vexKey], duration: 'q', clef: 'treble' });

  const addAcidente = (nota, acidente) => {
    if (acidente === '#')  nota.addModifier(new Accidental('#'), 0);
    if (acidente === 'b')  nota.addModifier(new Accidental('b'), 0);
    if (acidente === '##') nota.addModifier(new Accidental('##'), 0);
    if (acidente === 'bb') nota.addModifier(new Accidental('bb'), 0);
  };
  addAcidente(n1, n1info.acidente);
  addAcidente(n2, n2info.acidente);

  const voice = new Voice({ num_beats: 2, beat_value: 4 });
  voice.addTickables([n1, n2]);
  new Formatter().joinVoices([voice]).format([voice], 260);
  voice.draw(context, stave);

  elLegenda.textContent = `${n1info.bonito}  →  ${n2info.bonito}`;
}

// ============================================================
// ESTADO
// ============================================================
let indiceAtual = 0;
let selecionada = null;
let respostas = [];
let quizEncerrado = false;
let ajudaIntervaloUsada = false;
let respondida = false;

const elProgresso   = document.getElementById('progresso');
const elPartitura   = document.getElementById('partitura');
const elLegenda     = document.getElementById('legendaNotas');
const elOpcoes      = document.getElementById('opcoes');
const btnProxima    = document.getElementById('btnProxima');
const btnEncerrar   = document.getElementById('btnEncerrar');
const btnAjudaIntervalo = document.getElementById('btnAjudaIntervalo');
const btnOuvir      = document.getElementById('btnOuvir');
const elResultados  = document.getElementById('resultados');
const elPainelAjuda = document.getElementById('painelAjudaIntervalo');
const elPainelFeedback = document.getElementById('painelFeedback');
const areaQuiz      = document.getElementById('areaQuiz');

// ============================================================
// RENDERIZAR PERGUNTA
// ============================================================
function renderizarPergunta() {
  if (quizEncerrado) return;
  pararSom();
  btnOuvir.textContent = '▶ Ouvir';

  const p = perguntas[indiceAtual];
  selecionada = null;
  respondida = false;
  ajudaIntervaloUsada = false;
  btnAjudaIntervalo.disabled = false;
  btnOuvir.disabled = false;
  elPainelAjuda.classList.remove('visivel');
  elPainelAjuda.innerHTML = '';
  elPainelFeedback.classList.remove('visivel');
  elPainelFeedback.innerHTML = '';

  btnProxima.disabled = true;
  btnProxima.textContent = (indiceAtual === perguntas.length - 1) ? 'Finalizar ➡' : 'Próxima ➡';

  elProgresso.textContent = `Pergunta ${indiceAtual + 1} de ${perguntas.length}`;

  try {
    desenharPartitura(p.nota1, p.nota2);
  } catch (e) {
    elLegenda.textContent = e.message;
    elLegenda.style.color = 'red';
  }

  elOpcoes.innerHTML = '';
  p.opcoes.forEach((texto, i) => {
    const div = document.createElement('div');
    div.className = 'opcao';
    div.textContent = texto;
    div.dataset.indice = i;
    div.addEventListener('click', () => selecionarOpcao(i, div));
    elOpcoes.appendChild(div);
  });
}

function selecionarOpcao(i, elemento) {
  if (quizEncerrado || respondida) return;
  if (elemento.classList.contains('desabilitada')) return;
  document.querySelectorAll('.opcao').forEach(el => el.classList.remove('selecionada'));
  elemento.classList.add('selecionada');
  selecionada = i;
  btnProxima.disabled = false;
}

function ajudarIntervalo() {
  if (ajudaIntervaloUsada || quizEncerrado) return;
  const p = perguntas[indiceAtual];
  try {
    elPainelAjuda.innerHTML = gerarAnalise(p.nota1, p.nota2);
    elPainelAjuda.classList.add('visivel');
    ajudaIntervaloUsada = true;
    btnAjudaIntervalo.disabled = true;
  } catch (e) {
    elPainelAjuda.innerHTML = `<span style="color:#e53935">Erro na análise: ${e.message}</span>`;
    elPainelAjuda.classList.add('visivel');
  }
}

function proxima() {
  if (selecionada === null || quizEncerrado) return;

  const p = perguntas[indiceAtual];
  const acertou = selecionada === p.correta;

  respostas.push({
    pergunta: `${p.nota1} → ${p.nota2}`,
    escolhida: p.opcoes[selecionada],
    correta: p.opcoes[p.correta],
    acertou
  });

  document.querySelectorAll('.opcao').forEach(el => {
    const i = Number(el.dataset.indice);
    el.classList.add('desabilitada');
    el.classList.remove('selecionada');
    if (i === p.correta) el.classList.add('correta');
    else if (i === selecionada) el.classList.add('errada');
  });

  elPainelFeedback.innerHTML = `
    <span class="titulo">${acertou ? '✔ Correto!' : '✘ Incorreto'}</span>
    <div>Sua resposta: <span class="${acertou ? 'verde' : 'vermelho'}">${p.opcoes[selecionada]}</span></div>
    ${acertou ? '' : `<div>Resposta correta: <span class="verde">${p.opcoes[p.correta]}</span></div>`}
  `;
  elPainelFeedback.classList.add('visivel');

  respondida = true;
  btnAjudaIntervalo.disabled = true;
  btnProxima.disabled = true;
  btnOuvir.disabled = true;
  pararSom();

  const ehUltima = indiceAtual === perguntas.length - 1;
  const delay = 900;

  const id = setTimeout(() => {
    if (ehUltima) {
      encerrar();
    } else {
      indiceAtual++;
      renderizarPergunta();
    }
  }, delay);
  timeoutIds.push(id);
}

// ============================================================
// ENCERRAR
// ============================================================
function encerrar() {
  quizEncerrado = true;
  pararSom();
  areaQuiz.classList.add('oculto');

  const total = respostas.length;
  const acertos = respostas.filter(r => r.acertou).length;
  const erros = total - acertos;
  const pct = total ? Math.round((acertos / total) * 100) : 0;

  let html = `<h2>📊 Resultados</h2>`;
  html += `<p class="pontuacao">Você acertou <span class="acertos">${acertos}</span> de ${total} (${pct}%)</p>`;
  html += `<p><span class="acertos">✔ Acertos: ${acertos}</span> &nbsp;|&nbsp; <span class="erros">✘ Erros: ${erros}</span></p>`;
  html += `<div class="gabarito"><strong>Gabarito:</strong><ul>`;
  respostas.forEach(r => {
    const marca = r.acertou ? '✔' : '✘';
    const cor = r.acertou ? '#4caf50' : '#e53935';
    html += `<li><span style="color:${cor}">${marca}</span> ${r.pergunta} — Você: <em>${r.escolhida}</em>`;
    if (!r.acertou) html += ` | Correta: <strong>${r.correta}</strong>`;
    html += `</li>`;
  });
  html += `</ul></div>`;
  html += `<div class="botoes"><button id="btnReiniciar">🔄 Reiniciar</button></div>`;
  elResultados.innerHTML = html;
  elResultados.style.display = 'block';
  document.getElementById('btnReiniciar').addEventListener('click', reiniciar);
}

// ============================================================
// REINICIAR — gera nova ordem aleatória
// ============================================================
function reiniciar() {
  perguntas = gerarPerguntasEmbaralhadas(); // <-- nova ordem a cada reinício
  indiceAtual = 0;
  selecionada = null;
  respostas = [];
  quizEncerrado = false;
  respondida = false;
  ajudaIntervaloUsada = false;
  elPainelAjuda.classList.remove('visivel');
  elPainelAjuda.innerHTML = '';
  elPainelFeedback.classList.remove('visivel');
  elPainelFeedback.innerHTML = '';
  elResultados.style.display = 'none';
  areaQuiz.classList.remove('oculto');
  renderizarPergunta();
}

// ============================================================
// EVENTOS
// ============================================================
btnProxima.addEventListener('click', proxima);
btnEncerrar.addEventListener('click', encerrar);
btnAjudaIntervalo.addEventListener('click', ajudarIntervalo);
btnOuvir.addEventListener('click', () => {
  const p = perguntas[indiceAtual];
  if (p) tocarIntervalo(p.nota1, p.nota2);
});

// ============================================================
// INÍCIO — gera ordem aleatória já na primeira partida
// ============================================================
perguntas = gerarPerguntasEmbaralhadas();
renderizarPergunta();
</script>
</body>
